<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Display</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        .image-grid {
            width: 100vw;
            height: 100vh;

            display: grid;

            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);

            gap: 0;
        }

        .image-grid img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }
    </style>
</head>

<body>

    <div class="image-grid">
        <img src="image_1-1.png" alt="">
        <img src="image_1-2.png" alt="">
        <img src="image_1-3.png" alt="">
        <img src="image_1-4.png" alt="">

        <img src="image_2-1.png" alt="">
        <img src="image_2-2.png" alt="">
        <img src="image_2-3.png" alt="">
        <img src="image_2-4.png" alt="">
    </div>

</body>
</html>
