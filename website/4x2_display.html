<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Display</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        .image-grid {
            width: 100vw;
            height: 100vh;

            display: grid;

            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);

            gap: 0;
        }

        .image-grid img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
        }
    </style>
</head>

<body>

    <div class="image-grid">
        <img src="images/Display-4x2/image_1-1.gif" alt="">
        <img src="images/Display-4x2/image_1-2.gif" alt="">
        <img src="images/Display-4x2/image_1-3.gif" alt="">
        <img src="images/Display-4x2/image_1-4.gif" alt="">

        <img src="images/Display-4x2/image_2-1.gif" alt="">
        <img src="images/Display-4x2/image_2-2.gif" alt="">
        <img src="images/Display-4x2/image_2-3.gif" alt="">
        <img src="images/Display-4x2/image_2-4.gif" alt="">
    </div>
    <script>
        // Double-click anywhere to return to the menu
        document.addEventListener("dblclick", function () {
            window.location.href = "index.html";
        });

        // Press ESC or M to return to the menu
        document.addEventListener("keydown", function (event) {
            if (
                event.key === "Escape" ||
                event.key.toLowerCase() === "m"
            ) {
                window.location.href = "index.html";
            }
        });
    </script>

</body>
</html>
