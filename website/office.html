<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotating 3-Image Viewer</title>

<style>
body {
    margin: 0;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0px;
}

.grid img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: contain;
    background: black;
}
</style>
</head>
<body>

<div class="grid">
    <img id="img0">
    <img id="img1">
    <img id="img2">
</div>

<script>
const folder = "images/office/";
const extension = ".png";
const delay = 15000;

// Cached list of images we've discovered.
let images = [];
let startIndex = 0;

function imageExists(filename) {
    return new Promise(resolve => {
        const img = new Image();

        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);

        img.src = filename + "?t=" + Date.now(); // prevent caching
    });
}

async function discoverImages() {
    images = [];
    let n = 1;

    while (true) {
        const filename = `${folder}image${n}${extension}`;

        if (await imageExists(filename)) {
            images.push(filename);
            n++;
        } else {
            break;
        }
    }

    if (images.length === 0) {
        alert("No images found.");
    }
}

function showImages() {
    for (let i = 0; i < 3; i++) {
        const index = (startIndex + i) % images.length;
        document.getElementById("img" + i).src = images[index];
    }

    startIndex = (startIndex + 1) % images.length;
}

async function start() {
    await discoverImages();

    if (images.length === 0)
        return;

    showImages();
    setInterval(showImages, delay);
}

start();
</script>

</body>
</html>
