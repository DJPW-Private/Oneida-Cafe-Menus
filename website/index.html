<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oneida Campground and Lodge</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .logo {
            max-width: 300px;
            max-height: 200px;
            width: auto;
            height: auto;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 40px 0;
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 600;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .button {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100px;
            padding: 20px;
            background: #2f6f4e;
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 12px;
            transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
        }

        .button:hover {
            background: #24583e;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .button:active {
            transform: translateY(0);
            box-shadow: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="images/logos/oneida_indian.png"
             alt="Oneida Campground and Lodge"
             class="logo">

        <h1>Oneida Campground and Lodge</h1>

        <div class="buttons">

            <a href="cafe.html" class="button">
                Cafe (3 panel, rotating)
            </a>

            <a href="office.html" class="button">
                Office (3 panel, rotating)
            </a>

            <a href="4x2_display.html" class="button">
                4 × 2 Display
            </a>

            <a href="4x2_display_weather.html" class="button">
                4 × 2 Display with weather
            </a>

            <!-- Add additional display buttons here later -->

        </div>

    </div>

</body>
</html>
