<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oneida Campground and Lodge</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        .logo {
            max-width: 300px;
            max-height: 200px;
            width: auto;
            height: auto;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 40px 0;
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 600;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .button {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100px;
            padding: 20px;
            background: #2f6f4e;
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 12px;
            transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
        }

        .button:hover {
            background: #24583e;
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .button:active {
            transform: translateY(0);
            box-shadow: none;
        }

        #default-message {
            margin-top: 30px;
            color: #666;
            font-size: 1rem;
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="images/logos/oneida_indian.png"
             alt="Oneida Campground and Lodge"
             class="logo">

        <h1>Oneida Campground and Lodge</h1>

        <div class="buttons">

            <a href="cafe.html"
               class="button"
               onclick="selectPage('cafe.html')">
                Cafe
            </a>

            <a href="office.html"
               class="button"
               onclick="selectPage('office')">
                Office
            </a>
            
            <a href="4x2_display.html"
               class="button"
               onclick="selectPage('4x2_display.html')">
                4 × 2 Display
            </a>

            <a href="4x2_display_weather.html" 
                class="button"
                onclick="selectPage('4x2_display_weather.html')">
                4 × 2 Display with weather
            </a>

            <a href="4x2_display_weather_video.html" 
                class="button"
                onclick="selectPage('4x2_display_weather_video.html')">
                4 × 2 Display with weather and video
            </a>

        </div>

        <div id="default-message"></div>

    </div>


    <script>
        const DEFAULT_PAGE = "cafe.html";
        const TIMEOUT = 15000; // 15 seconds


        /*
         * Called whenever the user manually selects a page.
         * Save that page as the new default.
         */
        function selectPage(page) {
            localStorage.setItem("defaultDisplayPage", page);
        }


        /*
         * Get the previously selected page.
         * If no page has ever been selected, use DEFAULT_PAGE.
         */
        let defaultPage =
            localStorage.getItem("defaultDisplayPage") || DEFAULT_PAGE;


        /*
         * Display which page will automatically open.
         */
        document.getElementById("default-message").textContent =
            "Default display: " + defaultPage +
            " — opening automatically in 15 seconds";


        /*
         * Automatically open the default page after 15 seconds.
         */
        setTimeout(function () {
            window.location.href = defaultPage;
        }, TIMEOUT);

    </script>

</body>
</html>
